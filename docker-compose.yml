version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - node-api
      - python-api

  node-api:
    build: ./backend-node
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production

  python-api:
    build: ./backend-python
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=production
